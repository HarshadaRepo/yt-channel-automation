# Merging a "Draft:" pull request approves its script. This workflow then voices and
# animates it, uploads it to YouTube as PRIVATE, and comments the link on the PR.
# You publish it yourself in YouTube Studio after a final look.
name: Render and upload

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ["drafts/**/script.json"]
  workflow_dispatch:
    inputs:
      script:
        description: "Path to a script, e.g. drafts/<slug>/script.json"
        required: true
      upload:
        description: "Upload to YouTube (private)"
        type: boolean
        default: true
      tts:
        description: "Voice (auto = Gemini models, then Chatterbox, then Kokoro)"
        type: choice
        options: [auto, gemini, chatterbox, kokoro]
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_TOKEN: ${{ secrets.YT_TOKEN }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'ATLAS OF ODD FACTS' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find approved scripts
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scripts=${{ inputs.script }}" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} -- 'drafts/*/script.json' | tr '\n' ' ')
            echo "scripts=$files" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animator/package-lock.json

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji fonts-dejavu-core
          pip install -r requirements.txt
          cd animator && npm ci

      # Voice audio is cached by its text, so re-running a failed build spends no voice allowance.
      - name: Restore voice cache
        uses: actions/cache/restore@v4
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Render
        env:
          TTS: ${{ inputs.tts }}
        run: |
          mkdir -p .tts-cache && find .tts-cache -name '*.wav' -mtime +10 -delete
          flag=""
          [ -n "$TTS" ] && [ "$TTS" != "auto" ] && flag="--tts $TTS"
          for s in ${{ steps.find.outputs.scripts }}; do
            python run.py render "$s" --force --channel "$CHANNEL_NAME" $flag
          done

      - name: Save voice cache
        if: always() && hashFiles('.tts-cache/*.wav') != ''
        uses: actions/cache/save@v4
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload to YouTube (private)
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          for d in output/*/; do
            [ -f "$d/video.mp4" ] && python run.py upload "$d" --live
          done

      - name: Keep the video for download (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            output/*/video.mp4
            output/*/short.mp4
            output/*/thumbnail.jpg
            output/*/captions.srt
          retention-days: 7

      - name: Record what was published
        run: |
          python - <<'PY'
          import json, pathlib
          log = pathlib.Path("published.json")
          rows = json.loads(log.read_text()) if log.exists() else []
          for d in pathlib.Path("output").iterdir():
              yt = d / "youtube.json"
              meta = json.loads((d / "script.json").read_text())
              rows.append({"title": meta["title"], "slug": d.name,
                           **(json.loads(yt.read_text()) if yt.exists() else {"url": None})})
          log.write_text(json.dumps(rows, indent=2, ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          git commit -m "Record published video" || true
          git pull --rebase origin main && git push

      - name: Comment the YouTube link on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Rendered and uploaded as **private**. Download from this run's artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for y in output/*/youtube.json; do
            [ -f "$y" ] && body="$body"$'\n\n'"YouTube (private, publish it in Studio): $(python -c "import json;d=json.load(open('$y'));print(d['url'] + ('  |  Short: ' + d['short_url'] if d.get('short_url') else ''))")"
          done
          gh pr comment ${{ github.event.pull_request.number }} --body "$body"
