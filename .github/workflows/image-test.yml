# Paints a few sample pictures with each free image service and pushes them to the
# "image-test" branch, so the storybook look can be checked without rendering a video.
name: Image test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Cloudflare credentials
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, os, urllib.request, urllib.error
          acct, tok = os.environ["CF_ACCOUNT_ID"].strip(), os.environ["CF_API_TOKEN"].strip()
          print("account id length", len(acct), "looks like hex32:", len(acct) == 32 and all(c in "0123456789abcdef" for c in acct))
          for name, url in [("token", "https://api.cloudflare.com/client/v4/user/tokens/verify"),
                            ("accounts visible to token", "https://api.cloudflare.com/client/v4/accounts"),
                            ("flux models", f"https://api.cloudflare.com/client/v4/accounts/{acct}/ai/models/search?search=flux")]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"}), timeout=30) as r:
                      d = json.loads(r.read())
                  res = d.get("result")
                  if name.startswith("accounts"):
                      res = [{"id_matches": a["id"] == acct, "name_len": len(a.get("name", ""))} for a in res]
                  elif name == "flux models":
                      res = [m.get("name") for m in res]
                  print(name, "OK", res)
              except urllib.error.HTTPError as e:
                  print(name, e.code, e.read()[:300])
          EOF
      - name: Paint samples
        run: |
          mkdir -p image-test
          python - <<'EOF'
          import os, time, json
          from pathlib import Path
          from pipeline import images
          out = Path("image-test")
          painter = images.Painter()
          log = {"services": painter.services, "results": []}
          prompts = [
              "a worried Egyptian farmer in a linen kilt kneels by an almost empty grain basket beside a dry Nile field, mud-brick houses behind",
              "Roman road builders in tunics lay big paving stones on a straight road through green hills, one proud foreman points ahead",
              "Ming dynasty soldiers on a brick watchtower of the Great Wall at dusk light a smoke signal, mountains behind",
              "a Viking longship with a striped sail crosses a stormy grey sea, the crew rowing hard, one sailor looking scared",
          ]
          for i, p in enumerate(prompts):
              t = time.time()
              ok = painter.paint(p, out / f"sample-{i}.png", seed=i)
              log["results"].append({"prompt": i, "ok": ok, "seconds": round(time.time() - t, 1)})
              print(i, ok)
          painter.paint("a Roman legionary panics holding his head, beside an empty supply cart", out / "vertical.png", vertical=True)
          try:
              images.Painter().paint("an Egyptian pharaoh with a striped headdress panics, holding his head, beside a locked granary full of jars", out / "thumbnail.png", thumb=True)
          except Exception as e:
              print("thumb", e)
          (out / "log.json").write_text(json.dumps(log, indent=1))
          EOF
      - name: Push to image-test branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan image-test
          git rm -rfq --cached .
          git add image-test
          git commit -qm "Image test $(date -u +%F)"
          git push -f origin image-test
