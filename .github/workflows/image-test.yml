# Paints a few sample pictures with each free image service and pushes them to the
# "image-test" branch, so the storybook look can be checked without rendering a video.
name: Image test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Paint samples
        run: |
          mkdir -p image-test
          python - <<'EOF'
          import json
          from pathlib import Path
          import run
          from pipeline import images
          sp = "drafts/the-alleged-spy-who-brought-down-nvidia-s-ceo/script.json"
          s = json.load(open(sp))
          sc = s["scenes"]
          pick = {"both": next(x for x in sc if x["narration"].startswith("Cameras capture")),
                  "man": next(x for x in sc if x["narration"].startswith("Jensen Huang isn't happy")),
                  "woman": next(x for x in sc if x["narration"].startswith("Before entering"))}
          out = Path("image-test")
          p = images.Painter(art="minimal", refs=run._refs(s, sp))
          for k, x in pick.items():
              print(k, p.paint(x["picture"], out / f"ref-{k}.png", seed=1))
          q = images.Painter(art="minimal")
          print("noref", q.paint(pick["both"]["picture"], out / "noref-both.png", seed=1))
          print("spent", images._spent)
          EOF
      - name: Push to image-test branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan image-test
          git rm -rfq --cached .
          git add image-test
          git commit -qm "Image test $(date -u +%F)"
          git push -f origin image-test
